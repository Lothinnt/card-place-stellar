<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131314">
  <title>Card Place</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    /* base, keyframes and the few things inline styles can't do (backdrop, scrollbars, placeholders) */
    :root { --ease: cubic-bezier(0.4, 0, 0.2, 1); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #050506; color: #f2f2f2; font-family: "Outfit", system-ui, sans-serif; font-weight: 300; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
    input { font: inherit; color: inherit; }
    input::placeholder { color: rgba(255,255,255,.38); }
    .scroll { overflow-y: auto; scrollbar-width: none; } .scroll::-webkit-scrollbar { display: none; }
    .hscroll { overflow-x: auto; scrollbar-width: none; } .hscroll::-webkit-scrollbar { display: none; }
    .glass { background: rgba(28, 28, 30, .55); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); }
    .press { transition: transform .2s var(--ease), background .2s var(--ease), opacity .2s var(--ease); }
    .press:active { transform: scale(.97); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
    @keyframes float { 50% { transform: translateY(-8px); } }
    @keyframes shake { 20%, 60% { transform: rotate(-4deg); } 40%, 80% { transform: rotate(4deg); } }
    @keyframes sheen { from { background-position: 160% 0; } to { background-position: -60% 0; } }
    @keyframes reveal { from { transform: translateY(80px) rotateY(180deg) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
    .fade { animation: fadeUp .45s var(--ease) both; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
// Card Place — mobile app (React 18 via CDN, no build).
// Data: ../demo-web-page/data/*.json (sample data). The vault starts with the real testnet card,
// Zekrom ex PSA 10 (cert 137798077). Pack pulls are random sample data: no payment, nothing minted.
const { useState, useEffect, useMemo } = React;

const C = {
  bg: "#131314", card: "rgba(255,255,255,.045)", line: "rgba(255,255,255,.08)", line2: "rgba(255,255,255,.14)",
  text: "#f2f2f2", muted: "rgba(255,255,255,.52)", faint: "rgba(255,255,255,.3)", up: "#7fd3a1", down: "#e07a7a",
};
const img = (p) => (p && p.startsWith("img/") ? "../demo-web-page/" + p : p);
const eur = (n) => "€" + Math.round(n).toLocaleString("en-GB");
const usd = (n) => "$" + Math.round(n).toLocaleString("en-GB");
const pct = (v) => (v >= 0 ? "+" : "") + v.toFixed(1) + "%";

/* ---------- icons ---------- */
const Icon = ({ d, size = 24, fill = false, sw = 1.7 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill ? "currentColor" : "none"} stroke={fill ? "none" : "currentColor"} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{d}</svg>
);
const I = {
  home: <><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /><path d="M10 21v-6h4v6" /></>,
  explore: <><circle cx="12" cy="12" r="9" /><path d="m15.5 8.5-2 5-5 2 2-5z" /></>,
  vault: <><rect x="3" y="4" width="18" height="16" rx="2.5" /><circle cx="12" cy="12" r="3.5" /><path d="M12 8.5V7M15.5 12H17M12 15.5V17M8.5 12H7" /></>,
  search: <><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></>,
  profile: <><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" /></>,
  bell: <><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z" /><path d="M10 21h4" /></>,
  pack: <><rect x="5" y="3" width="14" height="18" rx="2" /><path d="M5 7h14" /></>,
  plus: <><path d="M12 5v14M5 12h14" /></>,
  swap: <><path d="M4 9h13l-3-3" /><path d="M20 15H7l3 3" /></>,
  chev: <path d="m9 6 6 6-6 6" />,
  back: <path d="m15 6-6 6 6 6" />,
  shield: <><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z" /><path d="m9 12 2 2 4-4" /></>,
  card: <><rect x="3" y="6" width="18" height="12" rx="2" /><path d="M3 10h18" /></>,
  lock: <><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></>,
  close: <path d="M6 6l12 12M18 6 6 18" />,
};

/* ---------- small building blocks ---------- */
const Spark = ({ pts, w = 120, h = 36, color }) => {
  if (!pts || !pts.length) return null;
  const min = Math.min(...pts), max = Math.max(...pts);
  const d = pts.map((p, i) => `${(i / (pts.length - 1)) * w},${h - 2 - ((p - min) / (max - min || 1)) * (h - 4)}`).join(" ");
  return <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}><polyline points={d} fill="none" stroke={color} strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round" /></svg>;
};
const Chip = ({ children, tone }) => (
  <span style={{ fontSize: 11, fontWeight: 600, padding: "3px 8px", borderRadius: 999, whiteSpace: "nowrap",
    color: tone === "ok" ? C.up : tone === "warn" ? "#e0b04b" : C.muted,
    border: `1px solid ${tone === "ok" ? "rgba(127,211,161,.4)" : tone === "warn" ? "rgba(224,176,75,.4)" : C.line2}` }}>{children}</span>
);
const Section = ({ title, action, children, style }) => (
  <section style={{ marginTop: 30, ...style }}>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 14 }}>
      <h2 style={{ margin: 0, fontSize: 19, fontWeight: 600, letterSpacing: "-0.01em" }}>{title}</h2>
      {action && <span style={{ fontSize: 13.5, color: C.muted }}>{action}</span>}
    </div>
    {children}
  </section>
);
const Header = ({ title, sub, right }) => (
  <header style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", padding: "8px 0 4px" }}>
    <div>
      {sub && <div style={{ fontSize: 14, color: C.muted, marginBottom: 2 }}>{sub}</div>}
      <h1 style={{ margin: 0, fontSize: 32, fontWeight: 600, letterSpacing: "-0.025em" }}>{title}</h1>
    </div>
    {right}
  </header>
);
const RoundBtn = ({ icon, onClick, badge }) => (
  <button onClick={onClick} className="press" style={{ position: "relative", width: 42, height: 42, borderRadius: 21, border: `1px solid ${C.line2}`, display: "flex", alignItems: "center", justifyContent: "center", background: C.card }}>
    <Icon d={icon} size={20} />
    {badge && <span style={{ position: "absolute", top: 9, right: 10, width: 7, height: 7, borderRadius: 4, background: C.text }} />}
  </button>
);
const Thumb = ({ src, w = 44, r = 6 }) => (
  <img src={img(src)} alt="" style={{ width: w, height: w * 1.4, objectFit: "cover", objectPosition: "top", borderRadius: r, flexShrink: 0, background: "#222" }} />
);
const CardRow = ({ c, onClick }) => (
  <button onClick={onClick} className="press" style={{ display: "flex", alignItems: "center", gap: 14, width: "100%", padding: "12px 0", borderBottom: `1px solid ${C.line}`, textAlign: "left" }}>
    <Thumb src={c.image} />
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ fontSize: 15.5, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.name}</div>
      <div style={{ fontSize: 12.5, color: C.muted, marginTop: 3 }}>{c.game} · PSA 10</div>
    </div>
    <Spark pts={c.spark} w={56} h={26} color={c.d7 >= 0 ? C.up : C.down} />
    <div style={{ textAlign: "right", minWidth: 78 }}>
      <div style={{ fontSize: 15, fontWeight: 600, fontVariantNumeric: "tabular-nums" }}>{usd(c.entry)}</div>
      <div style={{ fontSize: 12.5, color: c.d7 >= 0 ? C.up : C.down, marginTop: 2 }}>{pct(c.d7)}</div>
    </div>
  </button>
);
// booster sleeve: deep foil per game, holo overlay, moving sheen, crimped ends, emblem. Generic art, no official packaging.
const SLEEVE = { "Pokémon": ["#08291f", "#1d7a58", "#0c4b37", "#8ff0c3"], "One Piece": ["#2a0710", "#9a2238", "#5a0e1e", "#ffb0bb"], "Yu-Gi-Oh!": ["#0d0830", "#43309c", "#1d1460", "#c4b6ff"] };
const crimp = { position: "absolute", left: 0, right: 0, height: "8%", background: "repeating-linear-gradient(90deg, rgba(255,255,255,.32) 0 1.5px, rgba(0,0,0,.22) 1.5px 4px)", borderColor: "rgba(255,255,255,.25)" };
function PackFace({ game, w }) {
  const [a, b, c, accent] = SLEEVE[game] || ["#111", "#555", "#222", "#fff"];
  return (
    <div style={{ position: "absolute", inset: 0, overflow: "hidden", borderRadius: w * 0.06, fontSize: w / 23, color: "#fff",
      background: `linear-gradient(165deg, ${a}, ${b} 48%, ${c})`,
      boxShadow: "inset 14px 0 20px rgba(0,0,0,.38), inset -14px 0 20px rgba(0,0,0,.38), inset 0 0 0 1px rgba(255,255,255,.22)" }}>
      <div style={{ position: "absolute", inset: 0, mixBlendMode: "overlay", background: "conic-gradient(from 210deg at 28% 22%, rgba(255,255,255,0), rgba(255,255,255,.45), rgba(255,170,240,.25), rgba(120,220,255,.35), rgba(255,255,255,0) 70%)" }} />
      <div style={{ position: "absolute", inset: 0, background: "linear-gradient(105deg, transparent 38%, rgba(255,255,255,.42) 50%, transparent 62%)", backgroundSize: "250% 100%", animation: "sheen 3.2s ease-in-out infinite" }} />
      <div style={{ ...crimp, top: 0, borderBottom: "1px solid rgba(255,255,255,.25)" }} />
      <div style={{ ...crimp, bottom: 0, borderTop: "1px solid rgba(255,255,255,.25)" }} />
    </div>
  );
}
const PACKS = [
  { game: "Pokémon", sub: "Sealed booster · 10 cards", price: 6, odds: "1 in 18: a chase card" },
  { game: "One Piece", sub: "Sealed booster · 12 cards", price: 5, odds: "1 in 24: a parallel" },
  { game: "Yu-Gi-Oh!", sub: "Sealed booster · 9 cards", price: 4, odds: "1 in 12: a secret rare" },
];
// every card in the sample data is a top card: the game's best third pulls as CHASE, the rest as ULTRA RARE
const RARITY = [{ name: "CHASE", color: "#f2c94c" }, { name: "ULTRA RARE", color: "#c7a6f5" }];

/* ---------- screens ---------- */
function Home({ data, vault, go, openCard, openPack }) {
  const total = vault.filter((v) => v.status === "vault").reduce((s, v) => s + v.value, 0);
  const trending = [...data.cards].sort((a, b) => b.d7 - a.d7).slice(0, 6);
  return (
    <div className="fade">
      <Header sub="Good evening" title="Lothin" right={<RoundBtn icon={I.bell} badge />} />
      <div style={{ marginTop: 22, padding: 22, borderRadius: 26, background: "linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.02))", border: `1px solid ${C.line2}` }}>
        <div style={{ fontSize: 14, color: C.muted }}>Vault value</div>
        <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginTop: 4 }}>
          <span style={{ fontSize: 40, fontWeight: 600, letterSpacing: "-0.03em", fontVariantNumeric: "tabular-nums" }}>{eur(total)}</span>
          <span style={{ fontSize: 14, color: C.up }}>+{eur(320)} · 67%</span>
        </div>
        <div style={{ marginTop: 10 }}><Spark pts={[...data.zekrom.sales].filter((s) => s.grade === "10" && s.grader === "PSA").sort((a, b) => a.date.localeCompare(b.date)).map((s) => s.price)} w={330} h={56} color="rgba(255,255,255,.85)" /></div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginTop: 16 }}>
          {[["Open pack", I.pack, () => openPack(PACKS[0])], ["Deposit", I.plus, () => go("vault")], ["Trade", I.swap, () => go("explore")]].map(([t, ic, fn]) => (
            <button key={t} onClick={fn} className="press" style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6, padding: "12px 0", borderRadius: 16, background: "rgba(255,255,255,.07)", fontSize: 13, fontWeight: 500 }}>
              <Icon d={ic} size={20} />{t}
            </button>
          ))}
        </div>
      </div>
      <Section title="Trending this week" action="See all">
        <div className="hscroll" style={{ display: "flex", gap: 12, margin: "0 -20px", padding: "0 20px" }}>
          {trending.map((c) => (
            <button key={c.name} onClick={() => openCard(c)} className="press" style={{ width: 140, flexShrink: 0, textAlign: "left" }}>
              <img src={img(c.image)} alt="" style={{ width: 140, height: 196, objectFit: "cover", objectPosition: "top", borderRadius: 14, background: "#222" }} />
              <div style={{ fontSize: 14, fontWeight: 500, marginTop: 8, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.name}</div>
              <div style={{ fontSize: 13, color: C.up }}>{pct(c.d7)}</div>
            </button>
          ))}
        </div>
      </Section>
      <Section title="Open a pack" action="3 boosters">
        <div className="hscroll" style={{ display: "flex", gap: 12, margin: "0 -20px", padding: "0 20px" }}>
          {PACKS.map((p) => (
            <button key={p.game} onClick={() => openPack(p)} className="press" style={{ width: 150, flexShrink: 0, padding: 12, borderRadius: 20, background: C.card, border: `1px solid ${C.line}`, textAlign: "left" }}>
              <div style={{ position: "relative", height: 172, width: 113, margin: "0 auto" }}><PackFace game={p.game} w={113} /></div>
              <div style={{ fontSize: 14.5, fontWeight: 600, marginTop: 10 }}>{p.game}</div>
            </button>
          ))}
        </div>
      </Section>
      <Section title="Activity">
        {[["Zekrom ex PSA 10 entered your vault", "Token issued on Stellar · 09/10"], ["Last sale €800", "Zekrom ex PSA 10 · recorded on Stellar"], ["Price alert", "Umbreon VMAX alt art −3.0% this week"]].map(([t, s]) => (
          <div key={t} style={{ display: "flex", gap: 14, alignItems: "center", padding: "12px 0", borderBottom: `1px solid ${C.line}` }}>
            <span style={{ width: 8, height: 8, borderRadius: 4, background: C.text, flexShrink: 0 }} />
            <div><div style={{ fontSize: 14.5 }}>{t}</div><div style={{ fontSize: 12.5, color: C.muted, marginTop: 2 }}>{s}</div></div>
          </div>
        ))}
      </Section>
    </div>
  );
}

function Explore({ data, openCard }) {
  const [view, setView] = useState("cards");
  const [games, setGames] = useState([]);
  const all = [...new Set(data.cards.map((c) => c.game))];
  const toggle = (g) => setGames((s) => (s.includes(g) ? s.filter((x) => x !== g) : [...s, g]));
  const cards = data.cards.filter((c) => !games.length || games.includes(c.game));
  return (
    <div className="fade">
      <Header title="Explore" />
      <div style={{ display: "flex", padding: 4, borderRadius: 14, background: C.card, border: `1px solid ${C.line}`, marginTop: 18 }}>
        {[["cards", "By Card"], ["tcg", "By TCG"]].map(([k, t]) => (
          <button key={k} onClick={() => setView(k)} className="press" style={{ flex: 1, padding: "10px 0", borderRadius: 10, fontSize: 14.5, fontWeight: 500, background: view === k ? C.text : "transparent", color: view === k ? "#131314" : C.muted }}>{t}</button>
        ))}
      </div>
      {view === "cards" ? <>
        <div className="hscroll" style={{ display: "flex", gap: 8, margin: "16px -20px 4px", padding: "0 20px" }}>
          {all.map((g) => (
            <button key={g} onClick={() => toggle(g)} className="press" style={{ padding: "8px 14px", borderRadius: 999, fontSize: 13.5, whiteSpace: "nowrap", border: `1px solid ${games.includes(g) ? C.text : C.line2}`, background: games.includes(g) ? C.text : "transparent", color: games.includes(g) ? "#131314" : C.text }}>{g}</button>
          ))}
        </div>
        <div style={{ fontSize: 12.5, color: C.faint, margin: "10px 0 2px", display: "flex", justifyContent: "space-between" }}><span>CARD</span><span>ENTRY · 7D</span></div>
        {cards.map((c) => <CardRow key={c.name} c={c} onClick={() => openCard(c)} />)}
      </> : <div style={{ marginTop: 14 }}>
        {data.games.map((g) => (
          <div key={g.name} style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 0", borderBottom: `1px solid ${C.line}` }}>
            <span style={{ width: 22, fontSize: 13, color: C.faint }}>{g.rank}</span>
            <img src={img(g.logo)} alt="" style={{ width: 58, height: 30, objectFit: "contain", filter: "drop-shadow(0 0 1px rgba(255,255,255,.5))" }} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 15, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{g.name}</div>
              <div style={{ fontSize: 12.5, color: C.muted, marginTop: 2 }}>{g.dominance.toFixed(1)}% dominance</div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 15, fontWeight: 600 }}>{usd(g.index)}</div>
              <div style={{ fontSize: 12.5, color: g.d30 >= 0 ? C.up : C.down }}>{pct(g.d30)} 30d</div>
            </div>
          </div>
        ))}
      </div>}
    </div>
  );
}

function Vault({ vault, openCard }) {
  const kept = vault.filter((v) => v.status !== "ship");
  const total = kept.reduce((s, v) => s + v.value, 0);
  return (
    <div className="fade">
      <Header title="Vault" right={<Chip tone="ok">Secured storage</Chip>} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 18 }}>
        {[["Collection value", eur(total)], ["Cards in vault", kept.length]].map(([t, v]) => (
          <div key={t} style={{ padding: 16, borderRadius: 20, background: C.card, border: `1px solid ${C.line}` }}>
            <div style={{ fontSize: 13, color: C.muted }}>{t}</div>
            <div style={{ fontSize: 26, fontWeight: 600, marginTop: 4, fontVariantNumeric: "tabular-nums" }}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 10, alignItems: "center", marginTop: 12, padding: "12px 14px", borderRadius: 16, border: `1px solid ${C.line}`, color: C.muted, fontSize: 13.5 }}>
        <Icon d={I.shield} size={20} />Each card is authenticated, stored and tied to one Stellar token.
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 18 }}>
        {vault.map((c, i) => (
          <button key={i} onClick={() => openCard(c)} className="press" style={{ padding: 10, borderRadius: 20, background: C.card, border: `1px solid ${c.fresh ? C.text : C.line}`, textAlign: "left" }}>
            <img src={img(c.image)} alt="" style={{ width: "100%", aspectRatio: "5/7", objectFit: "cover", objectPosition: "top", borderRadius: 12, display: "block", background: "#222" }} />
            <div style={{ fontSize: 14.5, fontWeight: 600, marginTop: 9, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.name}</div>
            <div style={{ fontSize: 13, color: C.muted, marginTop: 1 }}>{eur(c.value)}</div>
            <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginTop: 8 }}>
              {c.status === "vault" ? <><Chip tone="ok">In vault</Chip><Chip>Token</Chip></> : c.status === "sell" ? <><Chip tone="ok">In vault</Chip><Chip>Listed for sale</Chip></> : <Chip tone="warn">Shipping</Chip>}
              {c.onchain && <Chip tone="ok">On-chain</Chip>}
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

function Search({ data, openCard }) {
  const [q, setQ] = useState("");
  const res = useMemo(() => {
    const s = q.trim().toLowerCase();
    return s ? data.cards.filter((c) => (c.name + " " + c.set + " " + c.game).toLowerCase().includes(s)) : [];
  }, [q, data.cards]);
  return (
    <div className="fade">
      <Header title="Search" />
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 18, padding: "0 16px", height: 52, borderRadius: 16, background: C.card, border: `1px solid ${C.line2}` }}>
        <span style={{ color: C.muted, display: "flex" }}><Icon d={I.search} size={20} /></span>
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Cards, sets, games, certificate…" style={{ flex: 1, background: "transparent", border: 0, outline: 0, fontSize: 16 }} />
        {q && <button onClick={() => setQ("")} style={{ color: C.muted, display: "flex" }}><Icon d={I.close} size={18} /></button>}
      </div>
      {q ? <div style={{ marginTop: 10 }}>
        {res.length ? res.map((c) => <CardRow key={c.name} c={c} onClick={() => openCard(c)} />) : <p style={{ color: C.muted, marginTop: 24, textAlign: "center" }}>No card matches “{q}”.</p>}
      </div> : <>
        <Section title="Recent">
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {["Zekrom ex", "Lugia V", "Charizard", "Black Lotus", "PSA 137798077"].map((t) => (
              <button key={t} onClick={() => setQ(t.startsWith("PSA") ? "Zekrom" : t)} className="press" style={{ padding: "9px 14px", borderRadius: 999, border: `1px solid ${C.line2}`, fontSize: 13.5 }}>{t}</button>
            ))}
          </div>
        </Section>
        <Section title="Popular sets">
          {["Evolving Skies", "Legend of Blue Eyes", "Limited Edition Alpha", "Paldean Fates"].map((t) => (
            <button key={t} onClick={() => setQ(t)} className="press" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", padding: "15px 0", borderBottom: `1px solid ${C.line}`, fontSize: 15.5 }}>
              {t}<span style={{ color: C.faint, display: "flex" }}><Icon d={I.chev} size={18} /></span>
            </button>
          ))}
        </Section>
      </>}
    </div>
  );
}

function Profile() {
  const Row = ({ icon, t, v }) => (
    <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "15px 0", borderBottom: `1px solid ${C.line}` }}>
      <span style={{ color: C.muted, display: "flex" }}><Icon d={icon} size={20} /></span>
      <span style={{ flex: 1, fontSize: 15.5 }}>{t}</span>
      {v && <span style={{ fontSize: 13.5, color: C.muted }}>{v}</span>}
      <span style={{ color: C.faint, display: "flex" }}><Icon d={I.chev} size={18} /></span>
    </div>
  );
  return (
    <div className="fade">
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginTop: 18 }}>
        <div style={{ width: 88, height: 88, borderRadius: 44, background: "linear-gradient(135deg, #3a3a3e, #1c1c1f)", border: `1px solid ${C.line2}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 32, fontWeight: 600 }}>L</div>
        <div style={{ fontSize: 22, fontWeight: 600, marginTop: 12 }}>Lothin</div>
        <div style={{ fontSize: 13.5, color: C.muted, marginTop: 2 }}>Collector since 2026 · Verified</div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 22 }}>
        {[["EUR balance", "€94.00"], ["USDC", "250.00"]].map(([t, v]) => (
          <div key={t} style={{ padding: 16, borderRadius: 20, background: C.card, border: `1px solid ${C.line}` }}>
            <div style={{ fontSize: 13, color: C.muted }}>{t}</div>
            <div style={{ fontSize: 24, fontWeight: 600, marginTop: 4 }}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{ marginTop: 12, padding: "12px 16px", borderRadius: 16, border: `1px solid ${C.line}`, display: "flex", justifyContent: "space-between", fontSize: 13.5 }}>
        <span style={{ color: C.muted }}>Stellar wallet</span><span style={{ fontVariantNumeric: "tabular-nums" }}>GDQ4…K2ZA</span>
      </div>
      <Section title="Account">
        <Row icon={I.shield} t="Identity" v="Verified" />
        <Row icon={I.card} t="Payment methods" v="Card · USDC" />
        <Row icon={I.bell} t="Price alerts" v="3 active" />
        <Row icon={I.lock} t="Security" v="Passkey" />
      </Section>

}

/* ---------- card detail and pack opening (full-screen sheets) ---------- */
function CardSheet({ c, close }) {
  const pts = c.spark || [480, 495, 540, 560, 610, 590, 640, 680, 700, 800];
  return (
    <div style={{ position: "absolute", inset: 0, zIndex: 40, background: C.bg, animation: "sheetUp .4s var(--ease)" }} className="scroll">
      <div style={{ padding: "16px 20px 40px" }}>
        <RoundBtn icon={I.back} onClick={close} />
        <img src={img(c.image)} alt="" style={{ display: "block", width: 210, aspectRatio: "5/7", objectFit: "cover", objectPosition: "top", margin: "14px auto 0", borderRadius: 14, boxShadow: "0 30px 80px rgba(0,0,0,.6)" }} />
        <h1 style={{ margin: "22px 0 0", fontSize: 26, fontWeight: 600 }}>{c.name}</h1>
        <div style={{ fontSize: 14, color: C.muted, marginTop: 4 }}>{c.set || c.game} · PSA 10</div>
        <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginTop: 14 }}>
          <span style={{ fontSize: 34, fontWeight: 600 }}>{c.entry ? usd(c.entry) : eur(c.value)}</span>
          {c.d7 != null && <span style={{ color: c.d7 >= 0 ? C.up : C.down }}>{pct(c.d7)} 7d</span>}
        </div>
        <div style={{ marginTop: 12 }}><Spark pts={pts} w={350} h={90} color="rgba(255,255,255,.85)" /></div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 18 }}>
          <button className="press" style={{ height: 52, borderRadius: 14, background: C.text, color: "#131314", fontWeight: 600, fontSize: 16 }}>Buy</button>
          <button className="press" style={{ height: 52, borderRadius: 14, border: `1px solid ${C.line2}`, fontWeight: 600, fontSize: 16 }}>Make an offer</button>
        </div>
        <div style={{ marginTop: 18, padding: 14, borderRadius: 16, border: `1px solid ${C.line}`, fontSize: 13.5, color: C.muted, display: "flex", gap: 10 }}>
          <Icon d={I.lock} size={20} />Money held in escrow until the card is checked. The card stays in the vault, only its token moves.
        </div>
      </div>
    </div>
  );
}

// sealed → shake → torn (the top flies off, the pull rises out of the pack) → revealed (pack drops, card comes forward)
function PackSheet({ pack, cards, close, keep }) {
  const [phase, setPhase] = useState("sealed");
  const [pull, setPull] = useState(null);
  const rip = () => {
    if (phase !== "sealed") return;
    const pool = cards.filter((c) => c.game === pack.game).sort((a, b) => b.cap - a.cap);
    const k = Math.floor(Math.random() * pool.length), card = pool[k];
    // a raw pull is worth a small share of the PSA 10 price (sample estimate)
    setPull({ ...card, rarity: RARITY[k < pool.length / 3 ? 0 : 1], value: card.entry * 0.03 });
    setPhase("shake");
    setTimeout(() => setPhase("torn"), 450);
    setTimeout(() => setPhase("revealed"), 2300);
  };
  const torn = phase === "torn" || phase === "revealed", revealed = phase === "revealed";
  // the opening animation starts on its own a moment after the sheet appears
  useEffect(() => { const t = setTimeout(rip, 900); return () => clearTimeout(t); }, []);
  const glow = pull ? pull.rarity.color : "#fff";
  return (
    <div style={{ position: "absolute", inset: 0, zIndex: 25, background: `radial-gradient(circle at 50% 36%, ${torn ? glow + "40" : "#26262a"}, transparent 60%), ${C.bg}`, animation: "fadeUp .35s var(--ease)", display: "flex", flexDirection: "column", alignItems: "center", padding: "max(18px, env(safe-area-inset-top)) 20px 100px" }}>
      <div style={{ alignSelf: "stretch", display: "flex", alignItems: "center", gap: 12 }}>
        <RoundBtn icon={I.back} onClick={close} />
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 13, color: C.muted }}>Open a pack</div>
          <div style={{ fontSize: 19, fontWeight: 600, letterSpacing: "-0.01em" }}>{pack.game} booster</div>
        </div>
      </div>
      <div style={{ position: "relative", width: 230, height: 350, marginTop: 70, 
        animation: phase === "shake" ? "shake .45s ease-in-out" : phase === "sealed" ? "float 2.4s ease-in-out infinite" : "none" }}>
        {/* the pulled card: hidden inside the pack, rises out of it once torn, then comes forward */}
        {pull && <div style={{ position: "absolute", left: 20, right: 20, top: 40, height: 266, zIndex: revealed ? 3 : 1,
          transition: "transform 1.1s cubic-bezier(.2,.9,.3,1.1), opacity .4s", opacity: torn ? 1 : 0,
          transform: revealed ? "translateY(-44px) scale(1.04)" : torn ? "translateY(-92px)" : "translateY(40px)" }}>
          <div style={{ position: "absolute", inset: -20, borderRadius: 30, background: glow, filter: "blur(34px)", opacity: torn ? .5 : 0, transition: "opacity .8s" }} />
          <img src={img(pull.image)} alt={pull.name} style={{ position: "relative", width: "100%", height: "100%", objectFit: "cover", objectPosition: "top", borderRadius: 12 }} />
        </div>}
        {/* torn-off top: the crimp and the strip above the tear line */}
        <div style={{ position: "absolute", inset: 0, zIndex: 4, clipPath: "polygon(0 0,100% 0,100% 16%,94% 17.4%,88% 15.8%,81% 17.6%,74% 15.9%,67% 17.5%,60% 15.8%,53% 17.6%,46% 15.9%,39% 17.5%,32% 15.8%,25% 17.6%,18% 15.9%,11% 17.5%,5% 15.8%,0 17%)",
          transition: "transform .7s var(--ease), opacity .7s", transform: torn ? "translate(90px,-190px) rotate(34deg)" : "none", opacity: torn ? 0 : 1 }}><PackFace game={pack.game} w={230} /></div>
        {/* the rest of the sleeve, open along the tear once torn; drops away on reveal */}
        <div style={{ position: "absolute", inset: 0, zIndex: 2, clipPath: "polygon(0 17%,5% 15.8%,11% 17.5%,18% 15.9%,25% 17.6%,32% 15.8%,39% 17.5%,46% 15.9%,53% 17.6%,60% 15.8%,67% 17.5%,74% 15.9%,81% 17.6%,88% 15.8%,94% 17.4%,100% 16%,100% 100%,0 100%)",
          transition: "transform .8s var(--ease), opacity .8s", transform: revealed ? "translateY(460px)" : "none", opacity: revealed ? 0 : 1,
          filter: "drop-shadow(0 24px 40px rgba(0,0,0,.55))" }}><PackFace game={pack.game} w={230} /></div>
      </div>
      {revealed && <div className="fade" style={{ textAlign: "center", width: "100%", marginTop: -40, animationDelay: ".6s" }}>
        <span style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: ".12em", padding: "4px 10px", borderRadius: 999, color: glow, border: `1px solid ${glow}` }}>{pull.rarity.name}</span>
        <h2 style={{ margin: "10px 0 0", fontSize: 24, fontWeight: 600 }}>{pull.name}</h2>
        <div style={{ fontSize: 14, color: C.muted, marginTop: 3 }}>Est. value <b style={{ color: C.text, fontWeight: 600 }}>{eur(pull.value)}</b></div>
        <button onClick={() => keep(pull, "vault")} className="press" style={{ width: "100%", height: 52, marginTop: 18, borderRadius: 14, background: C.text, color: "#131314", fontWeight: 600, fontSize: 16 }}>Keep in vault</button>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 10 }}>
          <button onClick={() => keep(pull, "sell")} className="press" style={{ height: 52, borderRadius: 14, border: `1px solid ${C.line2}`, fontWeight: 600, fontSize: 16 }}>Sell for {eur(pull.value)}</button>
          <button onClick={() => keep(pull, "ship")} className="press" style={{ height: 52, borderRadius: 14, border: `1px solid ${C.line2}`, fontWeight: 600, fontSize: 16 }}>Ship to me</button>
        </div>
      </div>}
    </div>
  );
}

/* ---------- translucent bottom tab bar ---------- */
const TABS = [["home", "Home", I.home], ["explore", "Explore", I.explore], ["vault", "Vault", I.vault], ["search", "Search", I.search], ["profile", "Profile", I.profile]];
function TabBar({ tab, setTab }) {
  return (
    <nav className="glass" style={{ position: "absolute", left: 12, right: 12, bottom: 14, zIndex: 30, height: 70, borderRadius: 26, border: `1px solid ${C.line2}`, display: "grid", gridTemplateColumns: "repeat(5, 1fr)", alignItems: "center", boxShadow: "0 10px 40px rgba(0,0,0,.45)" }}>
      {TABS.map(([k, t, ic]) => (
        <button key={k} onClick={() => setTab(k)} className="press" style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4, color: tab === k ? C.text : C.faint, fontSize: 11, fontWeight: tab === k ? 600 : 400 }}>
          <span style={{ display: "flex", padding: "4px 14px", borderRadius: 12, background: tab === k ? "rgba(255,255,255,.1)" : "transparent", transition: "background .25s var(--ease)" }}><Icon d={ic} size={22} sw={tab === k ? 2 : 1.7} /></span>
          {t}
        </button>
      ))}
    </nav>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState(new URLSearchParams(location.search).get("tab") || "home");
  const [sheet, setSheet] = useState(null);
  const [vault, setVault] = useState([{ name: "Zekrom ex", set: "BLK FR 2025 · 166/086", game: "Pokémon", image: "../docs/psa-137798077-front.jpg", value: 800, status: "vault", onchain: true }]);
  useEffect(() => {
    Promise.all(["market-cap", "market-overview", "zekrom"].map((f) => fetch(`../demo-web-page/data/${f}.json`).then((r) => r.json())))
      .then(([cap, ov, z]) => setData({ cards: cap.cards, games: ov.games, zekrom: z }));
  }, []);
  if (!data) return null;
  const openCard = (c) => setSheet({ type: "card", c });
  const openPack = (p) => setSheet({ type: "pack", p });
  const keep = (card, where) => { setVault((v) => [{ ...card, status: where, fresh: true }, ...v.map((x) => ({ ...x, fresh: false }))]); setSheet(null); setTab("vault"); };
  const props = { data, vault, go: setTab, openCard, openPack };
  const Screen = { home: Home, explore: Explore, vault: Vault, search: Search, profile: Profile }[tab];
  return (
    <div style={{ position: "relative", maxWidth: 430, height: "100dvh", margin: "0 auto", background: C.bg, overflow: "hidden" }}>
      <main key={tab} className="scroll" style={{ height: "100%", padding: "max(18px, env(safe-area-inset-top)) 20px 120px" }}><Screen {...props} /></main>
      {/* fade the content under the bar so the glass reads on any background */}
      <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, height: 120, background: "linear-gradient(to top, rgba(19,19,20,.85), transparent)", pointerEvents: "none", zIndex: 20 }} />
      <TabBar tab={tab} setTab={setTab} />
      {sheet?.type === "card" && <CardSheet c={sheet.c} close={() => setSheet(null)} />}
      {sheet?.type === "pack" && <PackSheet pack={sheet.p} cards={data.cards} close={() => setSheet(null)} keep={keep} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
