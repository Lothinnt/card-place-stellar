[package]
name = "card_vault"
version = "0.1.0"
edition = "2021"
publish = false
description = "Card Place vault: on-chain registry for graded trading cards held in a physical vault (Stellar / Soroban)"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
